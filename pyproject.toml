[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "navigation_planta"
version = "1.0.0"
description = "PDDL-TOMASys ontology for a navigation scenario"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Gustavo Rezende", email = "g.rezendesilva@tudelft.nl"},
]
dependencies = [
    "psutil",
    "networkx",
    "numpy==1.26.4",
    "matplotlib",
    "scipy",
    "unified-planning[fast-downward]",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["navigation_planta", "navigation_planta.*"]
